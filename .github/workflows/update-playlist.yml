name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          python3 <<'PY'
          import urllib.request

          sources = [
              ("🇬🇪 STB Georgia", "http://stb.ge/tv.m3u"),
              ("🇬🇪 Georgia", "https://iptv-org.github.io/iptv/countries/ge.m3u"),
              ("🇷🇺 Russia", "https://iptv-org.github.io/iptv/countries/ru.m3u"),
              ("⚽ Sports", "https://iptv-org.github.io/iptv/categories/sports.m3u"),
          ]

          output = ["#EXTM3U"]
          seen = set()

          for category, url in sources:
              print(f"Downloading: {category}")

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=60) as response:
                      text = response.read().decode("utf-8", errors="ignore")

                  lines = text.splitlines()
                  i = 0
                  added = 0

                  while i < len(lines):
                      line = lines[i].strip()

                      if line.startswith("#EXTINF"):
                          extinf = line
                          stream_url = None

                          j = i + 1

                          while j < len(lines):
                              candidate = lines[j].strip()

                              if candidate and not candidate.startswith("#"):
                                  stream_url = candidate
                                  break

                              j += 1

                          if stream_url:
                              # Remove old group-title if present
                              import re

                              extinf = re.sub(
                                  r'group-title="[^"]*"',
                                  '',
                                  extinf
                              )

                              # Add our category
                              extinf = extinf.replace(
                                  "#EXTINF:-1",
                                  f'#EXTINF:-1 group-title="{category}"',
                                  1
                              )

                              # Keep duplicates separated by category
                              key = (category, stream_url)

                              if key not in seen:
                                  output.append(extinf)
                                  output.append(stream_url)
                                  seen.add(key)
                                  added += 1

                          i = j
                      else:
                          i += 1

                  print(f"Added {added} channels")

              except Exception as e:
                  print(f"ERROR: {category}: {e}")

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print(f"Total entries: {len(seen)}")
          PY

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update categorized IPTV playlist"
          git push
